name: Docker Image CI/CD

on:
  push:
    branches: [ "main" ]
    # 当打上 v1.0.0 这种 Tag 时也会触发发布
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # 强制使用 Node 24 运行 Actions (应对 Node 20 弃用警告)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 使用 GitHub 提供的容器镜像仓库
  REGISTRY: ghcr.io
  # 镜像名称会是: ghcr.io/tarocats/slink
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN 由 Action 自动注入，无需手动配置
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # 为了加快构建速度，仅构建原生的 AMD64 平台 (不再通过 qemu 模拟 ARM64，因为 Rust 在 qemu 下编译极其缓慢)
          platforms: linux/amd64
          # 如果是 PR 就不 push，只做 build 测试
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 的缓存来加速 Docker 层构建（尤其是 Rust 编译）
          cache-from: type=gha
          cache-to: type=gha,mode=max